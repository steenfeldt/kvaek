{% extends "account/email/base_message.html" %}
{% block content %}
<p style="margin:0 0 16px;">Hej,</p>
<p style="margin:0 0 24px;">Du (eller en anden) har bedt om at nulstille adgangskoden til din konto.</p>
<p style="margin:0 0 20px;text-align:center;"><a href="{{ password_reset_url }}" style="display:inline-block;background:#b25532;color:#ffffff;text-decoration:none;padding:13px 32px;border-radius:10px;font-weight:600;">Vælg ny adgangskode</a></p>
<p style="margin:0;color:#6b5d4f;font-size:14px;">Har du ikke bedt om det, kan du se bort fra denne mail.</p>
{% endblock content %}
